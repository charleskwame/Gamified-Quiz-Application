name: Deploy

# Triggered by:
#   - your custom command: .\scripts\deploy.ps1   (repository_dispatch "deploy")
#   - manual run via the GitHub Actions UI        (workflow_dispatch)
on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.1). Leave empty to auto-increment the patch version."
        required: false
        type: string

permissions:
  contents: write # allow this workflow to create GitHub Releases and sync the version

# Only one deployment at a time; don't cancel an in-progress one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Decode the keystore + write key.properties from repo secrets.
      # Required because android/app/build.gradle.kts reads key.properties.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Version resolution (fully automatic):
      #   1) scripts/deploy.ps1 / deploy.sh  -> client_payload.version/buildNumber
      #   2) Actions UI with a version       -> inputs.version
      #   3) Actions UI without a version    -> auto-increment patch from latest release
      #   4) last resort                     -> version in pubspec.yaml
      - name: Determine release version
        id: version
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          BUILD_NUMBER="${{ github.event.client_payload.buildNumber }}"

          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.version }}"
          fi

          if [ -z "$VERSION" ]; then
            LATEST="$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" | jq -r '.tag_name // empty' 2>/dev/null || true)"
            if [ -n "$LATEST" ]; then
              BASE="$(sed -E 's/^v//' <<< "$LATEST")"
              IFS='.' read -r MAJ MIN PAT <<< "$BASE"
              if [ -n "$MAJ" ] && [ -n "$MIN" ] && [ -n "$PAT" ]; then
                VERSION="${MAJ}.${MIN}.$((PAT+1))"
                echo "Auto-incrementing: ${LATEST} -> v${VERSION}"
              fi
            fi
          fi

          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          fi

          VERSION="$(sed -E 's/^v//' <<< "$VERSION")"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(awk -F. '{print ($1*10000)+($2*100)+$3}' <<< "$VERSION")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "buildNumber=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # Keep pubspec.yaml in sync with the released version so the repo never
      # drifts from what was actually published. Idempotent (skips if unchanged).
      - name: Sync version in pubspec.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.buildNumber }}
        run: |
          NEW_LINE="version: ${VERSION}+${BUILD_NUMBER}"
          CURRENT="$(grep -m1 '^version:' pubspec.yaml || true)"
          if [ "$CURRENT" != "$NEW_LINE" ]; then
            sed -i "s/^version:.*/$NEW_LINE/" pubspec.yaml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.yaml
            git commit -m "chore: bump version to ${VERSION}+${BUILD_NUMBER}"
            BRANCH="${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${BRANCH}"
            echo "Updated ${CURRENT} -> ${NEW_LINE}"
          else
            echo "pubspec.yaml already at ${NEW_LINE}; nothing to commit"
          fi

      # --build-name/--build-number set versionName/versionCode on the APK/AAB
      - name: Build release APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ steps.version.outputs.buildNumber }}

      - name: Build release App Bundle
        run: flutter build appbundle --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ steps.version.outputs.buildNumber }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: gamified-quiz-release-${{ steps.version.outputs.version }}
          generate_release_notes: true
          # If a release already exists for this tag, it is updated (default behavior)
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
